<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Turtle Tower Defense: place turtles across campus to keep the trash out of the lake.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Turtle Tower Defense</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap">
</head>
<body>
<style>
/* Layout: game board left, field kit (controls, shop, turtle card, player card, leaderboard) right; stacks on phones. Single dark navy/gold world. */
:root{
  --ink:#08182b;
  --navy:#0f2a47;
  --navy-2:#173a5e;
  --line:#26507a;
  --gold:#f5b622;
  --gold-ink:#3a2800;
  --paper:#eef3f7;
  --muted:#9db3c8;
  --good:#5fc27a;
  --bad:#ef6a55;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--body);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
.app{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
h1{font-family:var(--display);font-weight:400;color:var(--gold);font-size:clamp(24px,3.4vw,34px);letter-spacing:.5px;margin:0;line-height:1;text-wrap:balance}
h1 span{color:var(--paper)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--navy);border:1px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.chip b{font-size:18px;font-weight:800}
.chip small{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:800}
.lakebar{width:84px;height:8px;border-radius:4px;background:var(--ink);overflow:hidden}
.lakebar i{display:block;height:100%;background:var(--good);transition:width .2s,background .2s}
.game{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.stage{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#4f8a37;min-width:0}
#cv{display:block;width:100%;aspect-ratio:960/600;max-width:100%;touch-action:manipulation;cursor:crosshair}
.overlay[hidden]{display:none!important}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,24,43,.78);padding:16px;overflow:auto}
.card{background:var(--navy);border:2px solid var(--gold);border-radius:14px;padding:20px 22px;max-width:660px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;margin:auto}
.card h2{font-family:var(--display);font-weight:400;color:var(--gold);font-size:30px;margin:0;line-height:1.05;text-wrap:balance}
.card p{margin:0;line-height:1.5;color:var(--paper)}
.card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.maps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:left}
.mapcard{display:flex;flex-direction:column;gap:4px;padding:8px;font-weight:700;text-align:left;min-width:0}
.mapcard canvas{width:100%;aspect-ratio:960/600;border-radius:6px;display:block}
.mapcard b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.3px}
.mapcard span{font-size:12px;color:var(--muted);font-weight:400;line-height:1.35}
.mapcard[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.mapcard.locked canvas{filter:grayscale(1) brightness(.55)}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.box{background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.box h3{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 8px;color:var(--paper);letter-spacing:.3px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.controls+.controls{margin-top:8px}
button{font:inherit;color:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--navy-2);padding:8px 12px;font-weight:800}
button:hover:not(:disabled){border-color:var(--gold)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.go{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);flex:1 1 140px;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.3px}
.go:disabled{opacity:.6}
.toggle[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.sm{padding:6px 10px;font-size:13px}
.boat{flex:1 1 auto}
.tray{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tray:empty{display:none}
.ab{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;font-size:12px;line-height:1.1;text-align:left}
.ab canvas{width:28px;height:28px;flex:none}
.ab i{font-style:normal;color:var(--gold);display:block;font-variant-numeric:tabular-nums}
.ab.ready{border-color:var(--gold)}
.shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tw{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;text-align:center;font-weight:700;line-height:1.15;min-width:0}
.tw canvas{width:46px;height:46px}
.tw .nm{font-size:12px}
.tw .pr{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.tw[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.tw.poor .pr{color:var(--bad)}
.tip{font-size:13px;color:var(--muted);line-height:1.45;margin:8px 0 0}
.info p{margin:0 0 8px;line-height:1.45;font-size:14px}
.ihead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.ihead canvas{width:52px;height:52px;flex:none}
.ihead h3{margin:0}
.ihead div{min-width:0}
.ihead small{color:var(--muted);font-size:13px;display:block}
.bonus{color:var(--good)!important}
.seg{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.seg button{flex:1;padding:6px 4px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:0 0 5px}
.ups{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.up{display:grid;grid-template-columns:1fr auto;text-align:left;gap:2px 8px;padding:8px 10px;font-weight:700}
.up span{font-size:12px;color:var(--muted);font-weight:400;grid-column:1}
.up em{font-style:normal;color:var(--gold);grid-column:2;grid-row:1/3;align-self:center;font-variant-numeric:tabular-nums}
.up.own{border-color:var(--good);opacity:1}
.up.own em{color:var(--good)}
.abil{width:100%;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;text-align:left;gap:2px 8px;border-color:var(--gold);background:#3a3410}
.abil span{font-size:12px;color:var(--muted);font-weight:400}
.abil em{font-style:normal;color:var(--gold);grid-column:2;grid-row:1/3;align-self:center}
.sell{width:100%;background:transparent;border-color:var(--bad);color:var(--bad)}
.me{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.me img{width:40px;height:40px;border-radius:50%;flex:none;background:var(--navy-2)}
.me b{display:block;font-size:16px}
.me small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;text-align:center}
.nums div{background:var(--ink);border-radius:8px;padding:6px 4px}
.nums b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.nums small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.bests{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.bests li{display:flex;justify-content:space-between;gap:8px}
.bests li span:last-child{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:800}
.bests li.lock span:last-child{color:var(--muted);font-weight:400}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.badge{font-size:11px;padding:4px 8px;border-radius:999px;font-weight:800;background:var(--ink);color:var(--muted);border:1px dashed var(--line)}
.badge.got{background:#3a3410;color:var(--gold);border:1px solid var(--gold)}
.bdesc{font-size:12px;color:var(--muted);margin:6px 0 0;min-height:1.3em}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{flex:1;padding:5px 4px;font-size:12px}
.tabs button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lb li{display:grid;grid-template-columns:22px 26px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding:4px 6px;border-radius:8px}
.lb li.you{background:#3a3410}
.lb li .rk{color:var(--muted);font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.lb li img{width:26px;height:26px;border-radius:50%}
.lb li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.lb li .sc{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.empty{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.keys{font-size:12px;color:var(--muted);line-height:1.5}
kbd{font-family:var(--body);background:var(--navy-2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
@media (max-width:980px){
  .game{grid-template-columns:minmax(0,1fr)}
  .keys{display:none}
}
@media (max-width:700px){
  .overlay{position:fixed;z-index:50;align-items:flex-start;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .card{padding:14px}
  .card h2{font-size:24px}
  .card p{font-size:14px;line-height:1.4}
  .maps{grid-template-columns:1fr}
  .mapcard{display:grid;grid-template-columns:120px 1fr;gap:4px 10px}
  .mapcard canvas{grid-row:1/4}
}
@media (prefers-reduced-motion:reduce){.lakebar i{transition:none}}
</style>

<div class="app">
  <header class="bar">
    <h1>Turtle <span>Tower Defense</span></h1>
    <div class="stats" aria-live="polite">
      <div class="chip"><small>Map</small><b id="mapName">Cedar Lake</b></div>
      <div class="chip"><small>Lake</small><div class="lakebar"><i id="lakeFill" style="width:100%"></i></div><b id="lake">100</b></div>
      <div class="chip"><small>Cash</small><b id="cash">$650</b></div>
      <div class="chip"><small>Round</small><b id="round">0 / 30</b></div>
    </div>
  </header>
  <main class="game">
    <div class="stage">
      <canvas id="cv" aria-label="Campus map. Trash travels along the sidewalks toward the lake."></canvas>
      <div class="overlay" id="overlay"><div class="card" id="ovCard"></div></div>
    </div>
    <aside class="panel">
      <div class="box">
        <div class="controls">
          <button class="go" id="goBtn">Send trash ▶</button>
          <button class="toggle" id="speedBtn" aria-pressed="false" title="Game speed">1×</button>
          <button class="toggle" id="autoBtn" aria-pressed="false" title="Start the next round automatically">Auto</button>
        </div>
        <div class="controls">
          <button class="sm boat" id="boatBtn" title="Restores 10 lake health and scoops out floating trash">Rowboat crew</button>
          <button class="sm toggle" id="sfxBtn" aria-pressed="true">Sound</button>
          <button class="sm toggle" id="musicBtn" aria-pressed="true">Music</button>
          <button class="sm" id="menuBtn">Maps</button>
        </div>
        <div class="tray" id="tray" aria-label="Turtle abilities"></div>
      </div>
      <div class="box">
        <h3>Turtles</h3>
        <div class="shop" id="shop"></div>
      </div>
      <div class="box info" id="info"></div>
      <div class="box" id="profile"></div>
      <div class="box" id="board"></div>
      <p class="keys">Keys: <kbd>1</kbd>–<kbd>9</kbd> pick a turtle · <kbd>Space</kbd> send trash · <kbd>B</kbd> rowboat · <kbd>Esc</kbd> cancel · hold <kbd>Shift</kbd> to place several</p>
    </aside>
  </main>
</div>

<script>
(function(){
'use strict';
const W=960,H=600,PW=40,LAST=30;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function lsGet(k){try{return localStorage.getItem(k);}catch(_){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(_){}}

/* =========================== MAPS =========================== */
const MAPS=[
  {id:'lake',name:'Cedar Lake',blurb:'One long walkway winds past the library and student center into Cedar Lake.',
    paths:[[[-40,110],[200,110],[200,470],[420,470],[420,180],[600,180],[600,520],[780,520],[780,402]]],
    lake:{x:790,y:298,rx:150,ry:112},fountain:{x:808,y:288},label:{x:775,y:350},
    build:[{x:245,y:205,w:130,h:72,n:'Centennial\nLibrary'},{x:245,y:345,w:130,h:72,n:'Stevens\nStudent Center'},{x:450,y:28,w:180,h:98,n:'Dixon Ministry\nCenter'},{x:24,y:516,w:160,h:64,n:'Callan Athletic\nCenter'},{x:830,y:466,w:118,h:106,n:'Engineering\n& Science'}],
    lot:{x:226,y:512,w:330,h:74},signs:[{x:8,y:62,t:'Trash blows in ▸'}],bridges:[],
    hills:[{x:510,y:330},{x:95,y:300}],rocks:[{x:300,y:165},{x:880,y:110}],
    oaks:[{x:130,y:210},{x:540,y:450},{x:690,y:462},{x:900,y:60},{x:55,y:430}]},
  {id:'north',name:'North Campus',diff:.78,blurb:'Trash blows in from both sides and meets at the lake. Watch two paths at once.',
    intro:'Trash is coming from both sides this time!',
    paths:[[[-40,500],[160,500],[160,290],[330,290],[330,420],[440,420],[440,180]],[[1000,500],[800,500],[800,290],[630,290],[630,420],[520,420],[520,180]]],
    lake:{x:480,y:110,rx:170,ry:80},fountain:{x:560,y:88},label:{x:400,y:120},
    build:[{x:30,y:40,w:160,h:100,n:'Residence\nHall'},{x:770,y:40,w:160,h:100,n:'Dining\nHall'},{x:195,y:345,w:100,h:70,n:'Fine Arts'},{x:665,y:345,w:100,h:70,n:'Science\nCenter'},{x:420,y:495,w:120,h:70,n:'Bookstore'}],
    lot:{x:14,y:200,w:112,h:74},signs:[{x:8,y:452,t:'Trash ▸'},{x:W-70,y:452,t:'◂ Trash'}],bridges:[],
    hills:[{x:245,y:215},{x:720,y:215}],rocks:[{x:385,y:330},{x:575,y:330}],
    oaks:[{x:900,y:250},{x:60,y:570},{x:900,y:570},{x:250,y:560}]},
  {id:'bridge',name:'Bridge Crossing',diff:.68,blurb:'The walkway crosses the lake on a footbridge, then loops back to dump into it.',
    intro:'The trash crosses the bridge first. Guard both shores!',
    paths:[[[-40,520],[140,520],[140,300],[860,300],[860,540],[480,540],[480,412]]],
    lake:{x:480,y:300,rx:200,ry:120},fountain:{x:600,y:240},label:{x:390,y:368},
    build:[{x:40,y:40,w:170,h:90,n:'Health\nCenter'},{x:730,y:30,w:190,h:100,n:'Athletic\nCenter'},{x:180,y:430,w:130,h:70,n:'Residence\nHall'}],
    lot:{x:20,y:150,w:230,h:74},signs:[{x:8,y:560,t:'Trash blows in ▸'}],bridges:[[262,300,698,300]],
    hills:[{x:760,y:430},{x:60,y:420}],rocks:[{x:330,y:165},{x:920,y:420}],
    oaks:[{x:620,y:150},{x:400,y:90},{x:600,y:470},{x:920,y:200}]},
];
let MAP=MAPS[0],LAKE=MAP.lake,PATHS=[],TREES=[],OAKS=[];
function buildPaths(m){return m.paths.map(pts=>{const seg=[];let tot=0;for(let i=0;i<pts.length-1;i++){const[x1,y1]=pts[i],[x2,y2]=pts[i+1];const L=Math.hypot(x2-x1,y2-y1);seg.push({x1,y1,x2,y2,L,s:tot});tot+=L;}return{pts,seg,total:tot};});}
function posAt(pi,d){
  const P=PATHS[pi];if(d<=0){const s=P.seg[0];const a=Math.atan2(s.y2-s.y1,s.x2-s.x1);return{x:s.x1+Math.cos(a)*d,y:s.y1+Math.sin(a)*d,a};}
  for(const s of P.seg){if(d<=s.s+s.L){const f=(d-s.s)/s.L;return{x:s.x1+(s.x2-s.x1)*f,y:s.y1+(s.y2-s.y1)*f,a:Math.atan2(s.y2-s.y1,s.x2-s.x1)};}}
  const l=P.seg[P.seg.length-1];return{x:l.x2,y:l.y2,a:Math.atan2(l.y2-l.y1,l.x2-l.x1)};
}
function segDist(px,py,s){const dx=s.x2-s.x1,dy=s.y2-s.y1;let t=((px-s.x1)*dx+(py-s.y1)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-(s.x1+dx*t),py-(s.y1+dy*t));}
function pathDistIn(paths,x,y){let m=1e9;for(const P of paths)for(const s of P.seg)m=Math.min(m,segDist(x,y,s));return m;}
function inLakeOf(L,x,y,pad){return((x-L.x)/(L.rx+pad))**2+((y-L.y)/(L.ry+pad))**2<1;}
function inRect(x,y,r,pad){return x>r.x-pad&&x<r.x+r.w+pad&&y>r.y-pad&&y<r.y+r.h+pad;}
const treeCache={};
function treesFor(m,paths){
  if(treeCache[m.id])return treeCache[m.id];
  const R=rng(m.id.length*977+42),T=[];let tries=0;
  while(T.length<55&&tries++<4000){
    const x=10+R()*(W-20),y=10+R()*(H-20),r=9+R()*9;
    if(pathDistIn(paths,x,y)<PW/2+r+4)continue;if(inLakeOf(m.lake,x,y,30))continue;
    if(m.build.some(b=>inRect(x,y,b,r+6))||(m.lot&&inRect(x,y,m.lot,r+4)))continue;
    if(m.hills.some(h=>Math.hypot(h.x-x,h.y-y)<36+r)||m.rocks.some(h=>Math.hypot(h.x-x,h.y-y)<24+r)||m.oaks.some(h=>Math.hypot(h.x-x,h.y-y)<30+r))continue;
    if(T.some(t=>Math.hypot(t.x-x,t.y-y)<t.r+r+2))continue;
    T.push({x,y,r});
  }
  return treeCache[m.id]=T;
}

/* =========================== TOWERS =========================== */
const TOWERS={
  pebble:{name:'Pebble Turtle',cost:200,range:115,rate:.9,shell:'#7d9a3c',rim:'#4a5e1f',skin:'#b4cf72',
    desc:'Tosses river pebbles at trash on the path.',
    ups:[{n:'Sharp Pebbles',c:140,d:'Each pebble hits 3 pieces.'},{n:'Quick Flippers',c:180,d:'Throws 40% faster.'},{n:'Long Toss',c:110,d:'+35 range.'}],
    ab:{n:'Rock Slide',d:'Throws 4× faster for 6 seconds.',cd:40}},
  spin:{name:'Spin Shell',cost:320,range:82,rate:1.2,shell:'#c27a2c',rim:'#7a4612',skin:'#e7b56f',
    desc:'Spins and flings shell shards in every direction.',
    ups:[{n:'Ridged Shell',c:200,d:'12 shards per spin.'},{n:'Dizzy Spin',c:260,d:'Spins 45% faster.'},{n:'Hot Shell',c:320,d:'Shards do 2 damage.'}],
    ab:{n:'Cyclone',d:'Fires three rings of hot shards.',cd:35}},
  net:{name:'Net Turtle',cost:260,range:110,rate:1.05,shell:'#2c9a8f',rim:'#145a54',skin:'#8fd6c9',
    desc:'Throws nets that slow trash down. Does no damage at first.',

function genRound(n){
  if(n===1)return[{k:'basic',t:0,c:20,gap:.7,at:0}];
  if(n===2)return[{k:'basic',t:0,c:32,gap:.48,at:0}];
  if(n===3)return[{k:'basic',t:0,c:16,gap:.5,at:0},{k:'basic',t:1,c:10,gap:.75,at:3}];
  if(n===4)return[{k:'basic',t:1,c:22,gap:.55,at:0},{k:'basic',t:0,c:18,gap:.35,at:2}];
  const R=rng(n*9973+7),g=[],DF=MAP.diff||1;let budget=(25+Math.pow(n,1.75)*4.5)*DF;
  const gap=Math.max(.1,.6-n*.016);let at=0;
  const dumps=n===25||n===28?1:n===30?2:n>30&&n%3===0?1+Math.floor((n-30)/6):0;
  if(dumps)g.push({k:'dump',c:dumps,gap:7,at:9});
  if(n>=16){const c=Math.floor((n-13)/3);g.push({k:'bag',c:Math.max(1,Math.round(c*DF)),gap:1.5,at:4});budget-=c*29*.6;}
  if(n>=9){const c=Math.floor((n-6)/2);g.push({k:'tire',c:Math.max(1,Math.round(c*DF)),gap:1.1,at:5});budget-=c*10*.6;}
  if(n>=7){const c=Math.min(30,4+Math.floor((n-7)*1.3));g.push({k:'butt',c:Math.max(1,Math.round(c*DF)),gap:.45,at:2.5});budget-=c*.6;}
  if(n>=11){const c=Math.min(20,3+Math.floor((n-11)*.9));g.push({k:'pbag',c:Math.max(1,Math.round(c*DF)),gap:.7,at:6});budget-=c*3*.6;}
  if(n>=14){const c=Math.min(16,2+Math.floor((n-14)*.7));g.push({k:'six',c:Math.max(1,Math.round(c*DF)),gap:1.1,at:7});budget-=c*8*.6;}
  const maxT=Math.min(4,Math.floor((n+1)/4));let guard=0;
  while(budget>0&&guard++<60){
    const t=Math.max(0,maxT-Math.floor(R()*3));
    const c=Math.max(4,Math.min(Math.ceil(budget/(t+1)),8+Math.floor(R()*18)));
    g.push({k:'basic',t,c,gap:gap*(1+(4-t)*.06),at});at+=c*gap*.55;budget-=c*(t+1);
  }
  return g;
}

const Snd={ctx:null,master:null,mg:null,noise:null,sfx:lsGet('ttd-sfx')!=='0',music:lsGet('ttd-music')!=='0',last:{},step:0,nextT:0,
  init(){

    this.mg=c.createGain();this.mg.gain.value=this.music?.13:0;this.mg.connect(this.master);

  tone(f,dur,type,vol,when,to,dest){

    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(dest||this.master);o.start(t);o.stop(t+dur+.02);
  },
  hiss(dur,vol,freq,when,type){
    const c=this.ctx,t=when||c.currentTime,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=this.noise;f.type=type||'lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+dur+.02);
  },
  play(n){
    if(!this.ctx||!this.sfx||this.ctx.state!=='running')return;
    const now=this.ctx.currentTime,gap={pop:.04,clink:.08,throw:.05,splash:.12,wave:.2,bite:.06,bubble:.06}[n]||0;
    if(gap&&this.last[n]&&now-this.last[n]<gap)return;this.last[n]=now;

      case'big':this.tone(220,.25,'sawtooth',.12,0,60);this.hiss(.25,.15,900);break;
      case'clink':this.tone(1800,.06,'triangle',.06);break;
      case'throw':this.hiss(.05,.04,2500,0,'highpass');break;
      case'bubble':this.tone(300,.12,'sine',.12,0,900);break;
      case'bite':this.tone(140,.08,'square',.1,0,70);break;
      case'wave':this.hiss(.5,.12,700);break;

      case'place':this.tone(392,.09,'triangle',.15);this.tone(587,.12,'triangle',.15,now+.07);break;

      case'ach':[784,988,1175,1568].forEach((f,i)=>this.tone(f,.18,'sine',.13,now+i*.07));break;
      case'boat':[0,.35,.7].forEach(d=>this.hiss(.25,.08,600,now+d));break;
      case'no':this.tone(180,.12,'square',.06);break;
      case'win':[523,659,784,1047,784,1047].forEach((f,i)=>this.tone(f,.22,'triangle',.14,now+i*.12));break;
      case'lose':[392,330,262,196].forEach((f,i)=>this.tone(f,.3,'triangle',.13,now+i*.2));break;
    }
  },
  setMusic(on){this.music=on;lsSet('ttd-music',on?'1':'0');if(this.mg)this.mg.gain.setTargetAtTime(on?.13:0,this.ctx.currentTime,.1);},
  sched(){
    const c=this.ctx;if(!c||c.state!=='running')return;

    const BASS=[0,0,5,5,7,7,0,0];
    while(this.nextT<c.currentTime+.3){
      const i=this.step%32,t=this.nextT,dur=.24,quiet=!this.music||!G||!G.started||G.over;
      if(!quiet){
        const m=MEL[i];if(m!==null)this.tone(392*Math.pow(2,m/12),.22,'triangle',.5,t,0,this.mg);

        if(i%2===1)this.tone(2400,.03,'square',.06,t,0,this.mg);
      }

    }
  }
};

function drawTurtle(g,type,ang,spin){
  const T=TOWERS[type];
  g.save();g.rotate(ang+(spin||0));
  g.fillStyle=T.skin;g.strokeStyle=T.rim;g.lineWidth=1.2;
  const big=type==='sea';
  for(const[fx,fy,fa,rx]of[[8,-13,-.5,big?10:6],[8,13,.5,big?10:6],[-9,-12,.6,6],[-9,12,-.6,6]]){g.save();g.translate(fx,fy);g.rotate(fa);g.beginPath();g.ellipse(0,0,rx,3.6,0,0,7);g.fill();g.stroke();g.restore();}
  g.beginPath();g.moveTo(-14,-2.5);g.lineTo(-20,0);g.lineTo(-14,2.5);g.fill();
  g.beginPath();g.ellipse(17,0,type==='snapper'?8:6.5,type==='snapper'?6:5.2,0,0,7);g.fill();g.stroke();
  if(type==='snapper'){g.strokeStyle=T.rim;g.lineWidth=1.4;g.beginPath();g.moveTo(20,0);g.lineTo(25,0);g.stroke();}
  g.fillStyle='#111';g.beginPath();g.arc(19.5,-2.4,1.2,0,7);g.arc(19.5,2.4,1.2,0,7);g.fill();
  if(type==='sharp'){g.strokeStyle='#6b4423';g.lineWidth=2;g.beginPath();g.moveTo(22,0);g.lineTo(28,0);g.moveTo(28,0);g.lineTo(32,-5);g.moveTo(28,0);g.lineTo(32,5);g.stroke();}
  if(type==='bubble'){g.strokeStyle='#d8ecff';g.lineWidth=1.5;g.beginPath();g.arc(26,0,4,0,7);g.stroke();}
  if(type==='net'){g.strokeStyle='rgba(240,240,220,.9)';g.lineWidth=1;for(let i=-4;i<=4;i+=4){g.beginPath();g.moveTo(22,i-3);g.lineTo(29,i+3);g.moveTo(22,i+3);g.lineTo(29,i-3);g.stroke();}}
  if(type==='scout'){g.fillStyle='#2a2a2a';g.fillRect(21,-5,6,4);g.fillRect(21,1,6,4);g.fillStyle='#8fd0ff';g.fillRect(26,-4.5,1.5,3);g.fillRect(26,1.5,1.5,3);}
  if(type==='spin'){g.fillStyle=T.rim;for(let i=0;i<8;i++){const a=i*Math.PI/4;g.beginPath();g.moveTo(Math.cos(a-.18)*13.5,Math.sin(a-.18)*12);g.lineTo(Math.cos(a)*19,Math.sin(a)*17);g.lineTo(Math.cos(a+.18)*13.5,Math.sin(a+.18)*12);g.fill();}}
  g.fillStyle=T.shell;g.strokeStyle=T.rim;g.lineWidth=2;g.beginPath();g.ellipse(0,0,15,13,0,0,7);g.fill();g.stroke();
  if(type==='recycler'){
    g.strokeStyle='#ffffff';g.lineWidth=2;g.lineCap='round';
    for(let i=0;i<3;i++){const a=i*2.094-1.57,b=a+1.6;g.beginPath();g.arc(0,0,6.5,a,b);g.stroke();const ex=Math.cos(b)*6.5,ey=Math.sin(b)*6.5;g.beginPath();g.moveTo(ex,ey);g.lineTo(ex+Math.cos(b+2.3)*3.5,ey+Math.sin(b+2.3)*3.5);g.stroke();}
    g.lineCap='butt';
  }else if(type==='snapper'){
    g.fillStyle=T.rim;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*5-2.5,0);g.lineTo(i*5,-4.5);g.lineTo(i*5+2.5,0);g.lineTo(i*5,4.5);g.closePath();g.fill();}
  }else{
    g.lineWidth=1.2;g.beginPath();
    for(let i=0;i<6;i++){const a=i*Math.PI/3+Math.PI/6,x=Math.cos(a)*6,y=Math.sin(a)*5.4;i?g.lineTo(x,y):g.moveTo(x,y);}
    g.closePath();g.stroke();
    for(let i=0;i<6;i++){const a=i*Math.PI/3+Math.PI/6;g.beginPath();g.moveTo(Math.cos(a)*6,Math.sin(a)*5.4);g.lineTo(Math.cos(a)*14.5,Math.sin(a)*12.5);g.stroke();}
  }
  if(type==='scout'){g.fillStyle='#3f6b2a';g.beginPath();g.ellipse(-2,0,6,6,0,0,7);g.fill();g.fillStyle='#f5b622';g.beginPath();g.arc(-2,0,2,0,7);g.fill();}
  g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.ellipse(-4,-5,6,3.5,-.5,0,7);g.fill();
  g.restore();
}

/* =========================== GAME LOGIC =========================== */
function spawn(kind,tier,d,pi,list){
  const big=kind==='basic'?null:BIG[kind];
  const e={id:G.nextId++,kind,tier:tier||0,hp:big?big.hp:0,max:big?big.hp:0,d,p:pi||0,slowT:0,slowF:1,x:0,y:0,a:0,dead:false,camo:!!(big&&big.camo),pushes:0};
  const p=posAt(e.p,d);e.x=p.x;e.y=p.y;e.a=p.a;(list||G.en).push(e);return e;
}
function startWave(){
  if(G.waveActive||G.over||!G.started)return;
  G.round++;const np=PATHS.length,ev=[];
  genRound(G.round).forEach((gp,gi)=>{for(let i=0;i<gp.c;i++)ev.push({t:(gp.at||0)+i*gp.gap,k:gp.k,tier:gp.t||0,p:(i+gi)%np});});
  ev.sort((a,b)=>a.t-b.t);G.queue=ev;G.waveT=0;G.waveActive=true;G.autoT=-1;
  const msg=G.round===1?(MAP.intro||'Trash is blowing toward the lake!'):NEWS[G.round];
  if(msg)G.banner={text:msg,t:4.5};Snd.play('round');
}
function endWave(){
  G.waveActive=false;const bonus=100+G.round;G.cash+=bonus;
  let inc=0;for(const t of G.towers)if(t.type==='recycler'){const v=st(t).income;inc+=v;fxText(t.x,t.y-24,'+$'+v,'#7ee08f');}
  G.cash+=inc;
  PROG.cleared+=G.cleared-G.clearedSaved;G.clearedSaved=G.cleared;
  let newBest=false;if(G.round>(PROG.best[MAP.id]||0)){PROG.best[MAP.id]=G.round;newBest=true;}
  if(G.round>=1)unlock('first');if(G.round>=10)unlock('r10');if(PROG.cleared>=10000)unlock('k10');
  saveProg(newBest);
  if(G.round===LAST&&!G.won){G.won=true;PROG.wins++;unlock('win');if(G.lake>=100)unlock('perfect');saveProg(true);Snd.play('win');showOverlay('win');return;}
  G.banner={text:'Round '+G.round+' cleared · +$'+(bonus+inc)+(newBest&&G.round>1?' · New best!':''),t:2.4};Snd.play('clear');
  if(G.auto)G.autoT=1;
}
function recordGame(){
  if(G.recorded||G.round===0)return;G.recorded=true;
  PROG.games++;PROG.cleared+=G.cleared-G.clearedSaved;G.clearedSaved=G.cleared;PROG.played[MAP.id]=1;
  if(MAPS.every(m=>PROG.played[m.id]))unlock('tour');
  saveProg(true);
}
function damage(e,dmg,armorPierce,src){
  if(e.dead||dmg<=0)return 0;
  if(e.kind==='tire'&&!armorPierce){fxText(e.x,e.y-14,'clink','#d0d6dc',.5);Snd.play('clink');return 0;}
  let got;
  if(e.kind==='basic'){
    got=Math.min(dmg,e.tier+1);e.tier-=dmg;
    if(e.tier<0){e.dead=true;puff(e.x,e.y,'#ffffff');}else puff(e.x,e.y,'#f5f0dc',3);
    Snd.play('pop');
  }else{
    const B=BIG[e.kind];got=Math.min(dmg,e.hp);e.hp-=dmg;
    if(B.tangle&&src&&src.type!=='recycler'){src.tangleT=2;}
    if(e.hp<=0){
      e.dead=true;puff(e.x,e.y,'#cfd6dc',e.kind==='dump'?18:8);Snd.play(e.kind==='dump'||e.kind==='bag'?'big':'pop');
      if(e.kind==='dump')unlock('dump');
      B.kids.forEach((k,i)=>spawn(k[0],k[1]||0,Math.max(0,e.d-i*14),e.p,G.newEn));
    }else Snd.play('pop');
  }
  G.cash+=got;G.cleared+=got;if(src)src.pops+=got;
  return got;
}
function puff(x,y,c,n){if(G.fx.length>500)return;for(let i=0;i<(n||6);i++){const a=Math.random()*6.283,s=30+Math.random()*60;G.fx.push({type:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:.35+Math.random()*.2,c});}}
function fxText(x,y,s,c,life){G.fx.push({type:'txt',x,y,s,c,t:0,life:life||1.1});}
function addFloater(kind,tier){
  if(G.floaters.length>=70)return;const a=Math.random()*6.283,r=Math.sqrt(Math.random())*.75;
  G.floaters.push({x:LAKE.x+Math.cos(a)*LAKE.rx*r,y:LAKE.y+Math.sin(a)*LAKE.ry*r,kind,tier,ph:Math.random()*6,rot:Math.random()*6});
}
function leak(e){
  e.dead=true;const v=rbe(e);G.lake=Math.max(0,G.lake-v);
  for(let i=0;i<Math.min(3,v);i++)addFloater(e.kind==='dump'?'bag':e.kind,e.kind==='basic'?e.tier:0);
  const P=PATHS[e.p].pts,end=P[P.length-1];fxText(end[0],end[1]-6,'−'+v,'#ef6a55');Snd.play('splash');
  if(G.lake<=0&&!G.over){G.over=true;G.waveActive=false;recordGame();Snd.play('lose');showOverlay('lose');}
}
function inRange(t,e,r){const dx=e.x-t.x,dy=e.y-t.y;return dx*dx+dy*dy<=(r+radOf(e))**2;}
function canSee(t,e){return!e.camo||t.seesCamo||G.spotT>0;}
function pickTarget(t,range,filter){
  let best=null,bv=-Infinity;
  for(const e of G.en){
    if(e.dead||e.x<-6||e.x>W+6)continue;if(!canSee(t,e))continue;if(!inRange(t,e,range))continue;if(filter&&!filter(e))continue;
    let v;const dd=(e.x-t.x)**2+(e.y-t.y)**2;
    switch(t.target){case'last':v=-e.d;break;case'strong':v=rbe(e)*1e5+e.d;break;case'close':v=-dd;break;default:v=e.d;}
    if(v>bv){bv=v;best=e;}
  }
  return best;
}
function lead(t,e,spd){const time=Math.hypot(e.x-t.x,e.y-t.y)/spd;return posAt(e.p,e.d+spdOf(e)*(e.slowT>0?e.slowF:1)*time);}
function shoot(t,e,spd,props){
  const p=lead(t,e,spd);const a=Math.atan2(p.y-t.y,p.x-t.x);t.ang=a;
  G.proj.push(Object.assign({x:t.x+Math.cos(a)*16,y:t.y+Math.sin(a)*16,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,a,hit:new Set(),dead:false,src:t},props));
}
function ringShards(t,n,spd,dmg,pierce,life,off){for(let i=0;i<n;i++){const a=i*6.283/n+(off||0);G.proj.push({x:t.x,y:t.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,a,kind:'shard',dmg,pierce,life,r:4,hit:new Set(),dead:false,src:t});}}
function fire(t){
  const s=st(t);
  switch(t.type){
    case'pebble':case'scout':{const e=pickTarget(t,s.range);if(!e)return false;shoot(t,e,540,{kind:'pebble',dmg:s.dmg,pierce:s.pierce,life:s.range/540*1.4,r:4.5});Snd.play('throw');return true;}
    case'spin':{let any=false;for(const e of G.en)if(!e.dead&&inRange(t,e,s.range)){any=true;break;}if(!any)return false;
      t.spinV=.35;ringShards(t,s.shards,400,s.dmg,1,s.range/400,t.spinA);t.spinA+=.2;Snd.play('throw');return true;}
    case'net':{const e=pickTarget(t,s.range,x=>x.kind!=='dump'&&x.slowT<.4)||pickTarget(t,s.range,x=>x.kind!=='dump');if(!e)return false;
      shoot(t,e,380,{kind:'net',dmg:s.dmg,pierce:s.pierce,slow:s.slow,life:s.range/380*1.5,r:8});Snd.play('throw');return true;}
    case'snapper':{const picked=[];for(let i=0;i<s.targets;i++){const e=pickTarget(t,s.range,x=>!picked.includes(x));if(!e)break;picked.push(e);}

      for(const e of picked){damage(e,s.dmg,true,t);G.fx.push({type:'bite',x:e.x,y:e.y,t:0,life:.2});}Snd.play('bite');return true;}
    case'sea':{const hit=G.en.filter(e=>!e.dead&&e.kind!=='dump'&&e.pushes<3&&e.d>0&&inRange(t,e,s.range));if(!hit.length)return false;
      for(const e of hit){e.d=Math.max(0,e.d-s.push);e.pushes++;const p=posAt(e.p,e.d);e.x=p.x;e.y=p.y;if(s.dmg)damage(e,s.dmg,false,t);}
      G.fx.push({type:'wave',x:t.x,y:t.y,r:s.range,t:0,life:.45});Snd.play('wave');return true;}
    case'bubble':{const e=pickTarget(t,s.range);if(!e)return false;shoot(t,e,320,{kind:'bubble',dmg:s.dmg,radius:s.radius,pierce:1,life:s.range/320*1.5,r:7});Snd.play('bubble');return true;}
    case'sharp':{const e=pickTarget(t,s.range);if(!e)return false;t.ang=Math.atan2(e.y-t.y,e.x-t.x);t.shots=(t.shots||0)+1;
      const crit=s.crit&&t.shots%3===0;damage(e,crit?12:s.dmg,true,t);
      G.fx.push({type:'line',x1:t.x+Math.cos(t.ang)*26,y1:t.y+Math.sin(t.ang)*26,x2:e.x,y2:e.y,t:0,life:.14,c:crit?'#f5b622':'#f3e3c4'});
      if(crit)fxText(e.x,e.y-16,'12!','#f5b622',.7);Snd.play('throw');return true;}
  }
  return false;
}
function explode(x,y,radius,dmg,src){
  let n=0;for(const e of G.en){if(e.dead)continue;if(Math.hypot(e.x-x,e.y-y)<radius+radOf(e)){damage(e,dmg,true,src);if(++n>=30)break;}}
  G.fx.push({type:'ring',x,y,r:radius,t:0,life:.3});Snd.play('bubble');
}
function strongest(n,filter){return G.en.filter(e=>!e.dead&&e.x>-6&&(!filter||filter(e))).sort((a,b)=>rbe(b)-rbe(a)).slice(0,n);}
function useAbility(t){
  if(!hasAb(t)||t.abCd>0||!G.started||G.over)return;
  const s=st(t);let ok=true;
  switch(t.type){
    case'pebble':t.boostT=6;break;
    case'spin':[300,380,460].forEach((sp,i)=>ringShards(t,16,sp,2,2,s.range*1.8/sp,i*.13));t.spinV=.35;break;
    case'net':for(const e of G.en){e.slowT=4;e.slowF=e.kind==='dump'?.6:.15;}break;
    case'snapper':{const e=pickTarget(t,s.range*1.6,null)||null;const cand=G.en.filter(x=>!x.dead&&inRange(t,x,s.range*1.6)).sort((a,b)=>rbe(b)-rbe(a))[0]||e;
      if(!cand){ok=false;break;}damage(cand,80,true,t);G.fx.push({type:'bite',x:cand.x,y:cand.y,t:0,life:.4,big:true});fxText(cand.x,cand.y-20,'CHOMP!','#f5b622',.9);break;}
    case'sea':for(const e of G.en){e.d=Math.max(0,e.d-(e.kind==='dump'?60:180));const p=posAt(e.p,e.d);e.x=p.x;e.y=p.y;}G.fx.push({type:'flash',t:0,life:.6,c:'rgba(120,190,240,'});break;
    case'scout':G.spotT=10;G.fx.push({type:'flash',t:0,life:.5,c:'rgba(255,240,170,'});break;
    case'bubble':{const tg=strongest(6);if(!tg.length){ok=false;break;}tg.forEach(e=>explode(e.x,e.y,70,3,t));break;}
    case'sharp':{const tg=strongest(6);if(!tg.length){ok=false;break;}
      for(let i=0;i<6;i++){const e=tg[i%tg.length];if(e.dead)continue;damage(e,20,true,t);G.fx.push({type:'line',x1:t.x,y1:t.y,x2:e.x,y2:e.y,t:0,life:.25,c:'#f5b622'});}break;}
    case'recycler':{const v=Math.round(st(t).income*1.5);G.cash+=v;fxText(t.x,t.y-24,'+$'+v,'#7ee08f',1.4);break;}
  }
  if(!ok){fxText(t.x,t.y-26,'No trash in reach','#ef6a55',.9);Snd.play('no');return;}
  t.abCd=TOWERS[t.type].ab.cd;Snd.play('ability');unlock('ability');renderInfo();
}
function useBoat(){
  if(!G.started||G.over||G.boatCd>0||G.boat)return;
  G.boat={t:0};G.boatCd=75;Snd.play('boat');unlock('boat');
}
function recomputeBuffs(){
  const scouts=G.towers.filter(t=>t.type==='scout');
  for(const t of G.towers){
    t.sbRange=1;t.sbRate=1;t.seesCamo=t.type==='scout';
    for(const s of scouts){if(s===t)continue;const b=scoutBase(s);if(Math.hypot(s.x-t.x,s.y-t.y)<=b.range){t.seesCamo=true;t.sbRange=Math.max(t.sbRange,b.buffR);t.sbRate=Math.min(t.sbRate,b.buffF);}}
  }
}
function update(dt){
  if(G.over)return;
  G.time+=dt;
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  if(G.autoT>0){G.autoT-=dt;if(G.autoT<=0){G.autoT=-1;if(G.auto)startWave();}}
  if(G.spotT>0)G.spotT-=dt;
  if(G.boatCd>0)G.boatCd-=dt;
  if(G.boat){G.boat.t+=dt;if(G.boat.t>=3){G.boat=null;G.lake=Math.min(100,G.lake+10);G.floaters.splice(0,20);fxText(LAKE.x,LAKE.y-20,'+10 lake','#7ee08f',1.4);Snd.play('clear');}}
  if(G.waveActive){G.waveT+=dt;while(G.queue.length&&G.queue[0].t<=G.waveT){const q=G.queue.shift();spawn(q.k,q.tier,0,q.p);}}
  for(const e of G.en){
    if(e.dead)continue;
    const sp=spdOf(e)*(e.slowT>0?e.slowF:1);if(e.slowT>0)e.slowT-=dt;
    e.d+=sp*dt;if(e.d>=PATHS[e.p].total){leak(e);if(G.over)return;continue;}
    const p=posAt(e.p,e.d);e.x=p.x;e.y=p.y;e.a=p.a;
  }
  for(const t of G.towers){
    if(t.spinV>0)t.spinV-=dt;if(t.biteV>0)t.biteV-=dt;if(t.boostT>0)t.boostT-=dt;if(t.abCd>0)t.abCd-=dt;if(t.tangleT>0)t.tangleT-=dt;
    if(t.type==='recycler')continue;
    t.cd-=dt*(t.tangleT>0?.5:1);if(t.cd<=0){if(fire(t))t.cd=st(t).rate;else t.cd=0;}
  }
  for(const p of G.proj){
    if(p.dead)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0){if(p.kind==='bubble')explode(p.x,p.y,p.radius,p.dmg,p.src);p.dead=true;continue;}
    for(const e of G.en){
      if(e.dead||p.hit.has(e))continue;const r=radOf(e)+p.r;
      if((e.x-p.x)**2+(e.y-p.y)**2<r*r){
        if(p.kind==='bubble'){explode(p.x,p.y,p.radius,p.dmg,p.src);p.dead=true;break;}
        p.hit.add(e);
        if(p.kind==='net'){if(e.kind!=='dump'){e.slowF=e.slowT>0?Math.min(e.slowF,p.slow):p.slow;e.slowT=2.6;}if(p.dmg)damage(e,p.dmg,false,p.src);}
        else damage(e,p.dmg,false,p.src);
        if(--p.pierce<=0){p.dead=true;break;}
      }
    }
  }
  for(const f of G.fx){f.t+=dt;if(f.type==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.9;f.vy*=.9;}if(f.type==='txt')f.y-=22*dt;}
  if(G.newEn.length){G.en.push(...G.newEn);G.newEn=[];}
  G.en=G.en.filter(e=>!e.dead);G.proj=G.proj.filter(p=>!p.dead);G.fx=G.fx.filter(f=>f.t<f.life);
  if(G.waveActive&&!G.queue.length&&!G.en.length)endWave();
}

/* =========================== PLACEMENT =========================== */
function oakAt(x,y,pad){return OAKS.find(o=>!o.cleared&&Math.hypot(o.x-x,o.y-y)<26+(pad||0));}
function placeProblem(x,y){
  if(x<16||y<16||x>W-16||y>H-16)return'edge';
  if(pathDistIn(PATHS,x,y)<PW/2+13)return'path';
  if(inLakeOf(LAKE,x,y,14))return'lake';
  if(MAP.build.some(b=>inRect(x,y,b,10)))return'building';
  if(oakAt(x,y,10))return'oak';
  if(G.towers.some(t=>Math.hypot(t.x-x,t.y-y)<30))return'turtle';
  return null;
}
function terrainAt(x,y){return{hill:MAP.hills.some(h=>Math.hypot(h.x-x,h.y-y)<32),rock:MAP.rocks.some(r=>Math.hypot(r.x-x,r.y-y)<26)};}
const PROBLEM={lake:'No swimming yet!',oak:'Clear the oaks first',path:'Keep the walkway clear',building:'Can\'t build on a building',turtle:'Too close to another turtle',edge:'Too close to the edge'};
function build(type,x,y){
  const T=TOWERS[type];
  if(G.cash<T.cost){fxText(x,y-20,'Need $'+T.cost,'#ef6a55',.9);Snd.play('no');return false;}
  const pr=placeProblem(x,y);if(pr){fxText(x,y-20,PROBLEM[pr],'#ef6a55',.9);Snd.play('no');return false;}
  G.cash-=T.cost;const tr=terrainAt(x,y);
  const t={type,x,y,ang:-Math.PI/2,cd:0,ups:[false,false,false],target:'first',pops:0,spent:T.cost,spinA:0,spinV:0,shots:0,abCd:0,hill:tr.hill,rock:tr.rock,tangleT:0,boostT:0};
  G.towers.push(t);recomputeBuffs();puff(x,y,'#d9f5c8',8);Snd.play('place');
  if(tr.hill)fxText(x,y-26,'Hill: +25% range','#7ee08f',1.2);if(tr.rock)fxText(x,y-26,'Sunny rock: +20% speed','#f5b622',1.2);
  if(G.towers.filter(q=>q.type==='recycler').length>=5)unlock('recycle');
  select(t);renderTray();return true;
}
function towerAt(p){let b=null,bd=22;for(const t of G.towers){const d=Math.hypot(t.x-p.x,t.y-p.y);if(d<bd){bd=d;b=t;}}return b;}

function clearOak(o){if(G.cash<OAK_COST){Snd.play('no');return;}G.cash-=OAK_COST;o.cleared=true;drawBg();puff(o.x,o.y,'#3d7a33',14);Snd.play('sell');unlock('oak');G.selOak=null;renderInfo();}

let scale=1,dpr=1;

function lerpC(a,b,f){const pa=a.match(/\w\w/g).map(h=>parseInt(h,16)),pb=b.match(/\w\w/g).map(h=>parseInt(h,16));return'rgb('+pa.map((v,i)=>Math.round(v+(pb[i]-v)*f)).join(',')+')';}
function drawLake(time){

  }else if(kind==='win'){
    const i=MAPS.indexOf(MAP),next=MAPS[i+1];
    ovCard.append(el('h2',null,'The lake is clean!'),el('p',null,'You held off all 30 rounds with the lake at '+Math.ceil(G.lake)+'% health.'+(next?' '+next.name+' is unlocked.':'')+' Keep going in endless mode, where the trash keeps getting worse.'));
    const row=el('div','row'),a=el('button','go','Keep playing');a.id='ovGo';a.onclick=()=>{ov.hidden=true;G.banner={text:'Endless mode. How long can the lake hold out?',t:3};if(G.auto)G.autoT=.8;};
    const b=el('button',null,'Change map');b.onclick=()=>{recordGame();G.over=true;chosenMap=next?i+1:i;showOverlay('start');};row.append(a,b);ovCard.appendChild(row);
  }
  const go=$('ovGo');if(go)go.focus({preventScroll:true});
}

/* =========================== LOOP & BOOT =========================== */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.started&&!G.over&&ov.hidden)for(let i=0;i<G.speed;i++)update(dt);
  render(now/1000);hud();requestAnimationFrame(frame);
}
function start(data){
  G=fresh();loadMap(MAPS[0]);
  if(data&&data.towers&&MAPS.some(m=>m.id===data.map)){
    loadMap(MAPS.find(m=>m.id===data.map));
    Object.assign(G,{cash:data.cash,lake:data.lake,round:data.round,speed:data.speed||1,auto:!!data.auto,started:true,won:!!data.won,cleared:data.cleared||0,clearedSaved:data.cleared||0});
    (data.oaks||[]).forEach((c,i)=>{if(c&&OAKS[i])OAKS[i].cleared=true;});drawBg();
    G.towers=data.towers.map(t=>({type:t.type,x:t.x,y:t.y,ang:t.ang,cd:0,ups:t.ups,target:t.target,pops:t.pops,spent:t.spent,spinA:0,spinV:0,shots:0,abCd:t.abCd||0,hill:t.hill,rock:t.rock,tangleT:0,boostT:0}));
    recomputeBuffs();ov.hidden=true;speedBtn.textContent=G.speed+'×';speedBtn.setAttribute('aria-pressed',String(G.speed>1));autoBtn.setAttribute('aria-pressed',String(G.auto));renderTray();
  }else showOverlay('start');
  renderInfo();renderProfile();renderBoard();resize();requestAnimationFrame(frame);
  initNet();
}
window.claude?.hot?.snapshot?.(()=>G&&G.started&&!G.over?{map:MAP.id,cash:G.cash,lake:G.lake,round:G.waveActive?G.round-1:G.round,speed:G.speed,auto:G.auto,won:G.won,cleared:G.cleared,oaks:OAKS.map(o=>o.cleared),towers:G.towers.map(t=>({type:t.type,x:t.x,y:t.y,ang:t.ang,ups:t.ups,target:t.target,pops:t.pops,spent:t.spent,abCd:t.abCd,hill:t.hill,rock:t.rock}))}:{});
window.__ttd={get G(){return G;},startWave,build,update,useAbility,useBoat,startGame,MAPS,placeProblem,get PATHS(){return PATHS;},get OAKS(){return OAKS;},clearOak,showOverlay};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(G)drawBg();if(!ov.hidden&&ovCard.querySelector('.maps'))showOverlay('start');});
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
